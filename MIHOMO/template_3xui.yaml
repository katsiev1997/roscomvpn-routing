rules:
  # --- Системные / приватные адреса ---
  - RULE-SET,private-ips,DIRECT,no-resolve
  - AND,((NETWORK,UDP),(DST-PORT,443)),REJECT-DROP # QUIC — принудительно через TCP
  - RULE-SET,private-domains,DIRECT

  # --- Блокировки ---
  - RULE-SET,category-ads,REJECT-DROP
  - RULE-SET,win-spy,REJECT-DROP

  # --- Торренты ---
  - RULE-SET,torrent-domains,DIRECT

  # --- Сервисы через PROXY ---
  - RULE-SET,google-play,PROXY
  - RULE-SET,twitch-ads,PROXY
  - RULE-SET,youtube,📺 Youtube
  - RULE-SET,telegram-ips,PROXY,no-resolve
  - RULE-SET,telegram,PROXY
  - RULE-SET,discord,💬 Discord.exe
  - RULE-SET,github,PROXY

  # --- Игровые платформы ---
  - RULE-SET,epicgames,🎮 Игры
  - RULE-SET,origin,🎮 Игры
  - RULE-SET,riot,🎮 Игры
  - RULE-SET,escapefromtarkov,🎮 Игры
  - RULE-SET,steam,🎮 Игры
  - RULE-SET,faceit,🎮 Игры

  # --- Сервисы в DIRECT ---
  - RULE-SET,twitch,DIRECT
  - RULE-SET,microsoft,DIRECT
  - RULE-SET,apple,DIRECT
  - RULE-SET,pinterest,DIRECT

  # --- Ваши правила (RU-сервисы напрямую) ---
  - DOMAIN-SUFFIX,ru,DIRECT
  - DOMAIN-SUFFIX,su,DIRECT
  - DOMAIN-SUFFIX,xn--p1ai,DIRECT
  - DOMAIN-SUFFIX,yandex.ru,DIRECT
  - DOMAIN-SUFFIX,vk.com,DIRECT
  - DOMAIN-SUFFIX,mail.ru,DIRECT
  - DOMAIN-SUFFIX,ozon.ru,DIRECT
  - DOMAIN-SUFFIX,wildberries.ru,DIRECT
  - DOMAIN-SUFFIX,avito.ru,DIRECT
  - DOMAIN-SUFFIX,gosuslugi.ru,DIRECT
  - DOMAIN-SUFFIX,sberbank.ru,DIRECT
  - DOMAIN-SUFFIX,tbank.ru,DIRECT
  - DOMAIN-SUFFIX,tinkoff.ru,DIRECT

  # --- DIRECT ---
  - RULE-SET,category-ru,DIRECT
  - RULE-SET,whitelist,DIRECT

  # --- Торренты ---
  - RULE-SET,torrent-clients,DIRECT

  # --- Приложения по имени процесса ---
  - PROCESS-NAME-REGEX,(?i)discord,💬 Discord.exe
  - PROCESS-NAME-REGEX,(?i)vesktop,💬 Discord.exe

  # --- Широкие категории ---
  - RULE-SET,games,🎮 Игры
  - RULE-SET,ru-apps,DIRECT

  # --- IP-адреса → DIRECT ---
  - RULE-SET,direct-ips,DIRECT
  - GEOIP,RU,DIRECT,no-resolve

  # --- Всё остальное → PROXY ---
  - MATCH,PROXY

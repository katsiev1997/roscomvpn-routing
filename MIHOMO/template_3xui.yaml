# ============================================================
# ШАБЛОН RoscomVPN ДЛЯ 3x-ui (Настройки подписки -> Clash / Mihomo)
# ============================================================
# Выложите файл по постоянной HTTPS-ссылке (например raw.githubusercontent.com)
# и вставьте ссылку в поле «Глобальные правила маршрутизации».
# Панель импортирует только proxy-groups, rule-providers и rules.
# Группа PROXY здесь заменяет группу панели: include-all подтягивает все ваши узлы.
# Можно вставить весь файл прямо в поле вручную, без ссылки.
proxy-groups:
  - name: PROXY
    type: select
    include-all: true
    proxies:
      - ⚡️ Авто
      - DIRECT
  - name: ⚡️ Авто
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 150
    include-all: true
    hidden: true
  - name: 📺 Youtube
    type: select
    include-all: true
    proxies:
      - PROXY
  - name: 💬 Discord.exe
    type: select
    include-all: true
    proxies:
      - PROXY
  - name: 🎮 Игры
    type: select
    include-all: true
    proxies:
      - DIRECT
      - PROXY
